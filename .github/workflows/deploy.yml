name: Deploy Admin Panel → Hostinger

on:
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Build
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_SUPABASE_SERVICE_KEY: ${{ secrets.VITE_SUPABASE_SERVICE_KEY }}

      - name: Verify build output
        run: |
          set -e
          test -f dist/index.html || { echo "❌ build no produjo dist/index.html"; exit 1; }
          test -d dist/assets    || { echo "❌ build no produjo dist/assets"; exit 1; }
          echo "✅ build ok — dist/index.html $(stat -c%s dist/index.html) bytes"
          ls -la dist/ | head -20

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.HOSTINGER_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -p ${{ secrets.HOSTINGER_PORT }} ${{ secrets.HOSTINGER_HOST }} >> ~/.ssh/known_hosts 2>/dev/null

      - name: Package build
        run: |
          tar czf /tmp/admin-dist.tar.gz -C dist .
          ls -la /tmp/admin-dist.tar.gz

      - name: Upload to Hostinger
        run: |
          scp -P ${{ secrets.HOSTINGER_PORT }} -i ~/.ssh/id_ed25519 \
            /tmp/admin-dist.tar.gz \
            ${{ secrets.HOSTINGER_USER }}@${{ secrets.HOSTINGER_HOST }}:/tmp/admin-dist.tar.gz

      - name: Atomic deploy on server
        run: |
          ssh -p ${{ secrets.HOSTINGER_PORT }} -i ~/.ssh/id_ed25519 \
            ${{ secrets.HOSTINGER_USER }}@${{ secrets.HOSTINGER_HOST }} << 'ENDSSH'
          set -euo pipefail

          TARGET="$HOME/domains/atlas.aliuntravelsrl.com/public_html"
          STAGING="$HOME/domains/atlas.aliuntravelsrl.com/_staging_$(date +%s)"
          BACKUP="$HOME/domains/atlas.aliuntravelsrl.com/_backup_$(date +%Y%m%d_%H%M%S)"

          echo "🔧 STAGING=$STAGING"
          mkdir -p "$STAGING"

          # 1) Extraer a staging (nunca tocar TARGET todavía)
          tar xzf /tmp/admin-dist.tar.gz -C "$STAGING"

          # 2) Validar que el staging tenga lo mínimo
          test -f "$STAGING/index.html" || { echo "❌ staging sin index.html — abortando"; rm -rf "$STAGING"; exit 1; }
          test -d "$STAGING/assets"     || { echo "❌ staging sin /assets — abortando"; rm -rf "$STAGING"; exit 1; }
          test -f "$STAGING/.htaccess"  || { echo "⚠️  staging sin .htaccess (SPA fallback puede fallar)"; }
          INDEX_SIZE=$(stat -c%s "$STAGING/index.html" 2>/dev/null || echo 0)
          [ "$INDEX_SIZE" -gt 100 ] || { echo "❌ index.html vacío ($INDEX_SIZE bytes) — abortando"; rm -rf "$STAGING"; exit 1; }
          echo "✅ staging válido — index.html=$INDEX_SIZE bytes"

          # 3) Permisos correctos en staging
          find "$STAGING" -type d -exec chmod 755 {} \; 2>/dev/null || true
          find "$STAGING" -type f -exec chmod 644 {} \; 2>/dev/null || true

          # 4) Backup del TARGET actual
          mkdir -p "$BACKUP"
          [ -f "$TARGET/index.html" ] && cp "$TARGET/index.html" "$BACKUP/" || true
          [ -f "$TARGET/.htaccess" ]  && cp "$TARGET/.htaccess"  "$BACKUP/" || true
          [ -d "$TARGET/assets" ]     && cp -r "$TARGET/assets"  "$BACKUP/" || true

          # 5) Swap atómico
          rm -f "$TARGET/index.html" "$TARGET/.htaccess"
          rm -rf "$TARGET/assets"
          cp -a "$STAGING/." "$TARGET/"
          rm -rf "$STAGING"

          # 6) Re-aplicar permisos (|| true: tolerar rutas fantasma en .builds/)
          find "$TARGET" -type d -exec chmod 755 {} \; 2>/dev/null || true
          find "$TARGET" -type f -exec chmod 644 {} \; 2>/dev/null || true

          # 7) Health check post-deploy
          test -f "$TARGET/index.html" || { echo "❌ POST-DEPLOY: falta index.html"; exit 1; }
          test -f "$TARGET/.htaccess"  || echo "⚠️  POST-DEPLOY: falta .htaccess"
          echo "✅ Deploy atómico completado: atlas.aliuntravelsrl.com"
          echo "   index.html: $(stat -c%s $TARGET/index.html) bytes"
          echo "   backup en:  $BACKUP"

          # 8) Limpieza
          rm -f /tmp/admin-dist.tar.gz

          # 9) Limpiar backups antiguos (mantener últimos 5)
          ls -1dt "$HOME/domains/atlas.aliuntravelsrl.com/_backup_"* 2>/dev/null | tail -n +6 | xargs -r rm -rf
          ENDSSH

      - name: Verify deploy on server (filesystem)
        run: |
          ssh -p ${{ secrets.HOSTINGER_PORT }} -i ~/.ssh/id_ed25519 \
            ${{ secrets.HOSTINGER_USER }}@${{ secrets.HOSTINGER_HOST }} << 'ENDSSH'
          set -euo pipefail
          TARGET="$HOME/domains/atlas.aliuntravelsrl.com/public_html"

          if [ ! -s "$TARGET/index.html" ]; then
            echo "❌ index.html falta o está vacío"
            ls -la "$TARGET/" | head -20
            exit 1
          fi
          INDEX_SIZE=$(stat -c%s "$TARGET/index.html")
          [ "$INDEX_SIZE" -gt 100 ] || { echo "❌ index.html demasiado pequeño ($INDEX_SIZE bytes)"; exit 1; }

          [ -s "$TARGET/.htaccess" ] || echo "⚠️  .htaccess falta o vacío — SPA routing puede fallar"

          test -d "$TARGET/assets" || { echo "❌ /assets falta"; exit 1; }
          JS_COUNT=$(find "$TARGET/assets" -name '*.js' | wc -l)
          [ "$JS_COUNT" -gt 0 ] || { echo "❌ /assets sin bundles JS"; exit 1; }

          test -r "$TARGET/index.html" || { echo "❌ index.html no legible"; exit 1; }

          echo "✅ POST-DEPLOY OK: index=$INDEX_SIZE bytes · assets/*.js=$JS_COUNT"
          ENDSSH

      - name: Cleanup SSH key
        if: always()
        run: rm -f ~/.ssh/id_ed25519
